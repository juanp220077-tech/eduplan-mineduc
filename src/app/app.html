<!-- Cabecera Superior Oscura -->
<header class="bg-[#0f172a] text-white px-6 py-3.5 flex items-center justify-between border-b border-slate-800 shadow-sm">
  <div class="flex items-center gap-3">
    <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center font-bold text-sm tracking-tighter shadow">
      EP
    </div>
    <div>
      <h1 class="text-sm font-bold leading-tight">EduPlan ERCA/DUA</h1>
      <p class="text-[11px] text-slate-400">Generador de Microplanificación Curricular · Estándar MinEduc Ecuador</p>
    </div>
  </div>

  <div class="flex items-center gap-3">
    <!-- Botón BYOK para Docentes -->
    <button 
      type="button"
      (click)="isKeyModalOpen = true"
      class="flex items-center gap-2 px-3 py-1 rounded-lg text-xs font-semibold border transition shadow-sm"
      [ngClass]="apiKeyService.hasValidKey() 
        ? 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40 hover:bg-emerald-500/30' 
        : 'bg-amber-500/20 text-amber-300 border-amber-500/40 hover:bg-amber-500/30 animate-pulse'">
      <span class="w-2 h-2 rounded-full" [ngClass]="apiKeyService.hasValidKey() ? 'bg-emerald-400' : 'bg-amber-400'"></span>
      <span>{{ apiKeyService.hasValidKey() ? '🔑 Clave IA Activa' : '🔑 Configurar Clave IA' }}</span>
    </button>
    <span class="text-xs bg-slate-800 text-slate-400 px-2 py-0.5 rounded border border-slate-700">PoC v1.0</span>
  </div>
</header>

<!-- Área de Trabajo Principal: 2 Columnas -->
<main class="max-w-[1600px] mx-auto p-6">
  <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
    <div class="lg:col-span-4">
      <app-curriculum-form></app-curriculum-form>
    </div>
    <div class="lg:col-span-8">
      <app-workspace-panel></app-workspace-panel>
    </div>
  </div>
</main>

<!-- Modal Asistido para Clave Groq -->
@if (isKeyModalOpen) {
  <app-api-key-modal (close)="isKeyModalOpen = false"></app-api-key-modal>
}
